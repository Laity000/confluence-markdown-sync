name: GitHub Release for Windows updater

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript regression tests
        run: |
          set -euo pipefail
          for test in test_*.js; do node "$test"; done
      - name: Packaging regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Read manifest version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("manifest.json",encoding="utf-8"))["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Determine whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and checksum immutable release ZIP
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          file="confluence-markdown-sync-extension-v${VERSION}.zip"
          python3 scripts/package_extension.py --version "$TAG" --output "dist/$file"
          cd dist
          sha256sum "$file" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create release (new versions only)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/confluence-markdown-sync-extension-v${VERSION}.zip" \
            "dist/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --title "Confluence Markdown Sync $TAG" \
            --notes "Chrome/Edge unpacked extension release. Windows updater checks SHA256 before applying. Install once using windows/Install-ConfluenceSyncUpdater.ps1."
