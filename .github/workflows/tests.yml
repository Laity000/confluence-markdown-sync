name: Tests
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          for f in test_*.js; do node "$f"; done
      - name: Run Python packaging and updater tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
